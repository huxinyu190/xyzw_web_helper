name: 构建 Windows 便携包

# 作用：不需要任何本地开发环境，GitHub 帮你 build，并打成「解压即用」的
# Windows 运行包（内含便携版 Node + 前端产物，无需安装任何软件）。
#
# 产出三个包：
#   xyzw-win7-x64.zip   Win7 64 位（内置 Node 12.22.12，最后一个支持 Win7 的版本）
#   xyzw-win7-x86.zip   Win7 32 位（内置 Node 12.22.12 x86）
#   xyzw-win10-x64.zip  Win10 / Win11 64 位（内置 Node 22 LTS）
#
# 用法：仓库页面 → Actions → 左侧「构建 Windows 便携包」→ Run workflow
#       跑完后在该次运行页面底部 Artifacts 下载所需包
#
# 推 v* 标签（如 v2.2.0）时，release.yml 会调用本工作流并自动挂到 Release 上。

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "deploy/portable/**"
      - ".github/workflows/build-portable-package.yml"

concurrency:
  group: portable-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        # 版本由 package.json 的 packageManager 字段决定（pnpm@10.19.0），
        # 这里不要再写 version，避免出现 "Multiple versions of pnpm specified"
        uses: pnpm/action-setup@v4

      - name: 安装 Node（仅用于构建）
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 组装运行包（Win7 x64/x86 + Win10 x64）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem | Out-Null

          # 失败时把原因写进检查注解，Actions 页面与 API 都能直接看到
          function Fail($message) {
            Write-Host "::error title=打包失败::$message"
            throw $message
          }

          try {
            if (-not (Test-Path "dist/index.html")) { Fail "dist/index.html 不存在，构建可能失败了" }

            # 内置的便携 Node：Win7 用 12（最后支持 Win7 的版本），Win10+ 用 22 LTS
            $targets = @(
              @{ Name = "win7-x64";  NodeVersion = "12.22.12"; Arch = "x64" },
              @{ Name = "win7-x86";  NodeVersion = "12.22.12"; Arch = "x86" },
              @{ Name = "win10-x64"; NodeVersion = "22.23.5";  Arch = "x64" }
            )
            $commonFiles = @(
              "server.js", "package.json", "README.txt",
              "run.vbs", "start.bat", "start-lan.bat", "stop.bat", "open.bat", "start-hidden.vbs"
            )

            $cwd = (Get-Location).Path
            New-Item -ItemType Directory -Force -Path "out" | Out-Null

            foreach ($t in $targets) {
              $name = $t.Name
              $ver = $t.NodeVersion
              $arch = $t.Arch
              $nodeDir = Join-Path $cwd "node-v$ver-win-$arch"
              $nodeZip = "node-v$ver-win-$arch.zip"
              Write-Host "== 准备 $name（Node $ver $arch）"

              if (-not (Test-Path $nodeDir)) {
                if (-not (Test-Path $nodeZip)) {
                  $url = "https://nodejs.org/dist/v$ver/$nodeZip"
                  Write-Host "   下载 $url"
                  & curl.exe -fL --retry 3 --retry-delay 3 --max-time 900 -o $nodeZip $url
                  if ($LASTEXITCODE -ne 0) { Fail "下载 $url 失败（curl exit $LASTEXITCODE）" }
                }
                New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
                Write-Host "   解压 $nodeZip"
                try {
                  [System.IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $cwd $nodeZip), $nodeDir)
                } catch {
                  Fail "解压 $nodeZip 失败：$($_.Exception.Message)"
                }
              }

              $pkg = Join-Path $cwd "out/xyzw-$name/xyzw"
              New-Item -ItemType Directory -Force -Path (Join-Path $pkg "web") | Out-Null
              New-Item -ItemType Directory -Force -Path (Join-Path $pkg "node") | Out-Null

              Write-Host "   复制前端产物"
              Copy-Item -Recurse -Force "dist/*" (Join-Path $pkg "web")

              Write-Host "   复制启动脚本"
              foreach ($file in $commonFiles) {
                $src = "deploy/portable/$file"
                if (-not (Test-Path $src)) { Fail "缺少部署文件 $src" }
                Copy-Item -Force $src (Join-Path $pkg $file)
              }

              Write-Host "   复制便携 Node"
              Copy-Item -Recurse -Force (Join-Path $nodeDir "*") (Join-Path $pkg "node")

              if (-not (Test-Path (Join-Path $pkg "node/node.exe"))) { Fail "$name：node/node.exe 缺失" }
              if (-not (Test-Path (Join-Path $pkg "web/index.html"))) { Fail "$name：web/index.html 缺失" }

              $zipPath = Join-Path $cwd "out/xyzw-$name.zip"
              if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
              Write-Host "   压缩 -> out/xyzw-$name.zip"
              try {
                [System.IO.Compression.ZipFile]::CreateFromDirectory(
                  $pkg,
                  $zipPath,
                  [System.IO.Compression.CompressionLevel]::Optimal,
                  $false
                )
              } catch {
                Fail "压缩 $name 失败：$($_.Exception.Message)"
              }

              $size = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
              Write-Host "   已生成 out/xyzw-$name.zip（$size MB）"
            }

            Write-Host "== 全部完成"
            Get-ChildItem "out/*.zip" | ForEach-Object {
              Write-Host ("   {0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 1))
            }
          } catch {
            Write-Host "::error title=打包失败::$($_.Exception.Message)"
            exit 1
          }

      - name: 上传 Win7 x64
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-win7-x64
          path: out/xyzw-win7-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Win7 x86
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-win7-x86
          path: out/xyzw-win7-x86.zip
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Win10 x64
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-win10-x64
          path: out/xyzw-win10-x64.zip
          if-no-files-found: error
          retention-days: 30
