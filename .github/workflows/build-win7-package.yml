name: 构建 Win7 便携包

# 作用：不需要任何本地开发环境，GitHub 帮你 build，并打成一个
# "解压即用" 的 Windows 7 运行包（内含 Node 12 便携版 + 前端产物）。
#
# 用法：仓库页面 → Actions → 左侧「构建 Win7 便携包」→ Run workflow
#       跑完后在该次运行页面底部 Artifacts 下载 xyzw-win7-x64 / xyzw-win7-x86

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
      - "deploy/win7/**"
      - ".github/workflows/build-win7-package.yml"

concurrency:
  group: win7-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        # 版本由 package.json 的 packageManager 字段决定（pnpm@10.19.0），
        # 这里不要再写 version，避免出现 "Multiple versions of pnpm specified"
        uses: pnpm/action-setup@v4

      - name: 安装 Node（仅用于构建）
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 组装 Win7 运行包（x64 / x86）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archs = @(
            @{ Name = "x64"; Url = "https://nodejs.org/dist/v12.22.12/node-v12.22.12-win-x64.zip"; Dir = "node-v12.22.12-win-x64" },
            @{ Name = "x86"; Url = "https://nodejs.org/dist/v12.22.12/node-v12.22.12-win-x86.zip"; Dir = "node-v12.22.12-win-x86" }
          )

          New-Item -ItemType Directory -Force -Path out | Out-Null

          foreach ($arch in $archs) {
            $pkg = "out/xyzw-win7-$($arch.Name)/xyzw-win7"
            New-Item -ItemType Directory -Force -Path "$pkg/web", "$pkg/node" | Out-Null

            Copy-Item -Recurse -Force "dist/*" "$pkg/web/"
            Copy-Item -Force "deploy/win7/server.js", "deploy/win7/package.json", "deploy/win7/README.txt" "$pkg/"
            Copy-Item -Force "deploy/win7/start.bat", "deploy/win7/start-lan.bat", "deploy/win7/stop.bat", "deploy/win7/open.bat", "deploy/win7/start-hidden.vbs" "$pkg/"

            $zip = "node12-$($arch.Name).zip"
            Invoke-WebRequest -Uri $arch.Url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "node12-$($arch.Name)"
            Copy-Item -Recurse -Force "node12-$($arch.Name)/$($arch.Dir)/*" "$pkg/node/"

            Compress-Archive -Path "$pkg/*" -DestinationPath "out/xyzw-win7-$($arch.Name).zip" -Force
            Write-Host "已生成 out/xyzw-win7-$($arch.Name).zip"
          }

      - name: 上传 x64 运行包
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-win7-x64
          path: out/xyzw-win7-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: 上传 x86 运行包
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-win7-x86
          path: out/xyzw-win7-x86.zip
          if-no-files-found: error
          retention-days: 30
